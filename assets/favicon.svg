<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background -->
  <rect x="0" y="0" width="64" height="64" rx="8" fill="#2c3e50" />
  
  <!-- Arcade -->
  <rect x="8" y="12" width="48" height="32" rx="4" fill="#3498db" />
  <rect x="12" y="16" width="40" height="24" rx="2" fill="#ecf0f1" />
  
  <!-- Game elements -->
  <!-- Tetris blocks -->
  <rect x="16" y="20" width="4" height="4" fill="#e74c3c" />
  <rect x="20" y="20" width="4" height="4" fill="#e74c3c" />
  <rect x="24" y="20" width="4" height="4" fill="#e74c3c" />
  <rect x="20" y="24" width="4" height="4" fill="#e74c3c" />
  
  <!-- Snake -->
  <rect x="32" y="20" width="4" height="4" fill="#2ecc71" />
  <rect x="36" y="20" width="4" height="4" fill="#2ecc71" />
  <rect x="40" y="20" width="4" height="4" fill="#2ecc71" />
  <rect x="44" y="20" width="4" height="4" fill="#2ecc71" />
  <circle cx="32" cy="24" r="2" fill="#e74c3c" />
  
  <!-- Minesweeper -->
  <rect x="16" y="32" width="4" height="4" fill="#3498db" />
  <rect x="20" y="32" width="4" height="4" fill="#3498db" />
  <rect x="24" y="32" width="4" height="4" fill="#3498db" />
  <rect x="28" y="32" width="4" height="4" fill="#3498db" />
  <text x="17" y="35.5" font-family="Arial" font-size="4" font-weight="bold" fill="#2c3e50">1</text>
  <text x="21" y="35.5" font-family="Arial" font-size="4" font-weight="bold" fill="#2c3e50">2</text>
  <circle cx="26" cy="34" r="1.5" fill="#2c3e50" />
  
  <!-- Controls -->
  <rect x="16" y="48" width="32" height="6" rx="3" fill="#3498db" />
  <circle cx="22" cy="51" r="2" fill="#e74c3c" />
  <circle cx="30" cy="51" r="2" fill="#f1c40f" />
  <circle cx="38" cy="51" r="2" fill="#2ecc71" />
  <circle cx="46" cy="51" r="2" fill="#9b59b6" />
</svg>
