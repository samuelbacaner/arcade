<svg width="300" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="180" fill="#3498db" />
  <g transform="translate(60, 30)">
    <rect width="180" height="120" fill="#f9f9f9" rx="5" ry="5" />
    <g transform="translate(15, 15)" stroke="#555" stroke-width="1.5">
      <!-- Grid -->
      <rect x="0" y="0" width="30" height="30" fill="#ccc" />
      <rect x="30" y="0" width="30" height="30" fill="#f9f9f9" />
      <rect x="60" y="0" width="30" height="30" fill="#f9f9f9" />
      <rect x="90" y="0" width="30" height="30" fill="#f9f9f9" />
      <rect x="120" y="0" width="30" height="30" fill="#ccc" />
      
      <rect x="0" y="30" width="30" height="30" fill="#f9f9f9" />
      <rect x="30" y="30" width="30" height="30" fill="#f9f9f9" />
      <rect x="60" y="30" width="30" height="30" fill="#ccc" />
      <rect x="90" y="30" width="30" height="30" fill="#f9f9f9" />
      <rect x="120" y="30" width="30" height="30" fill="#f9f9f9" />
      
      <rect x="0" y="60" width="30" height="30" fill="#f9f9f9" />
      <rect x="30" y="60" width="30" height="30" fill="#ccc" />
      <rect x="60" y="60" width="30" height="30" fill="#f9f9f9" />
      <rect x="90" y="60" width="30" height="30" fill="#f9f9f9" />
      <rect x="120" y="60" width="30" height="30" fill="#f9f9f9" />
      
      <!-- Numbers -->
      <text x="15" y="85" font-family="Arial" font-size="22" text-anchor="middle" fill="blue">1</text>
      <text x="75" y="25" font-family="Arial" font-size="22" text-anchor="middle" fill="green">2</text>
      <text x="45" y="55" font-family="Arial" font-size="22" text-anchor="middle" fill="red">3</text>
      
      <!-- Flag -->
      <g transform="translate(15, 15)">
        <rect x="105" y="0" width="15" height="15" fill="red" />
        <line x1="120" y1="0" x2="120" y2="20" stroke="black" stroke-width="2" />
      </g>
      
      <!-- Mine -->
      <g transform="translate(15, 15)">
        <circle cx="15" cy="15" r="10" fill="#333" />
        <line x1="15" y1="5" x2="15" y2="25" stroke="#000" stroke-width="2" />
        <line x1="5" y1="15" x2="25" y2="15" stroke="#000" stroke-width="2" />
        <line x1="8" y1="8" x2="22" y2="22" stroke="#000" stroke-width="2" />
        <line x1="22" y1="8" x2="8" y2="22" stroke="#000" stroke-width="2" />
      </g>
    </g>
  </g>
</svg>
