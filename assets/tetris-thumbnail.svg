<svg width="300" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="180" fill="#2ecc71" />
  <g transform="translate(80, 30)">
    <rect width="140" height="120" fill="#f9f9f9" rx="5" ry="5" />
    
    <!-- Tetris pieces -->
    <!-- I piece -->
    <g transform="translate(20, 10)">
      <rect x="0" y="0" width="20" height="20" fill="#00FFFF" stroke="#333" stroke-width="1" />
      <rect x="20" y="0" width="20" height="20" fill="#00FFFF" stroke="#333" stroke-width="1" />
      <rect x="40" y="0" width="20" height="20" fill="#00FFFF" stroke="#333" stroke-width="1" />
      <rect x="60" y="0" width="20" height="20" fill="#00FFFF" stroke="#333" stroke-width="1" />
    </g>
    
    <!-- L piece -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="20" height="20" fill="#FF7F00" stroke="#333" stroke-width="1" />
      <rect x="0" y="20" width="20" height="20" fill="#FF7F00" stroke="#333" stroke-width="1" />
      <rect x="20" y="20" width="20" height="20" fill="#FF7F00" stroke="#333" stroke-width="1" />
      <rect x="40" y="20" width="20" height="20" fill="#FF7F00" stroke="#333" stroke-width="1" />
    </g>
    
    <!-- Z piece -->
    <g transform="translate(70, 40)">
      <rect x="0" y="0" width="20" height="20" fill="#FF0000" stroke="#333" stroke-width="1" />
      <rect x="20" y="0" width="20" height="20" fill="#FF0000" stroke="#333" stroke-width="1" />
      <rect x="20" y="20" width="20" height="20" fill="#FF0000" stroke="#333" stroke-width="1" />
      <rect x="40" y="20" width="20" height="20" fill="#FF0000" stroke="#333" stroke-width="1" />
    </g>
    
    <!-- T piece -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="20" height="20" fill="#800080" stroke="#333" stroke-width="1" />
      <rect x="20" y="0" width="20" height="20" fill="#800080" stroke="#333" stroke-width="1" />
      <rect x="40" y="0" width="20" height="20" fill="#800080" stroke="#333" stroke-width="1" />
      <rect x="20" y="20" width="20" height="20" fill="#800080" stroke="#333" stroke-width="1" />
    </g>
  </g>
</svg>
